<body class="paper-grain fs-m">

<div class="topbar" id="topbar">

  <span class="spacer"></span>
  <button class="iconbtn" id="btnAtlas" title="时间轴与地图">◎</button>

<div class="readprogress" id="readprogress"></div>

<div class="sheet-mask" id="sheetMask"></div>

    <span class="lab">正文字号</span>
    <div class="seg" id="segFont">
      <button data-fs="fs-s">小</button>
      <button data-fs="fs-m" class="on">中</button>
      <button data-fs="fs-l">大</button>
      <button data-fs="fs-xl">特大</button>
    </div>
  </div>
  <div class="setting-row">
    <span class="lab">阅读主题</span>
    <div class="seg" id="segTheme">
      <button data-theme="light" class="on">宣纸</button>
      <button data-theme="dark">夜读</button>
    </div>
  </div>
  <button class="reset" id="btnReset">清除全部学习进度</button>
